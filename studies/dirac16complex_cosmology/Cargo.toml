[package]
name = "dirac16complex_cosmology"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Stage-3 numerics of the dirac16complex (complex Grassmann Spin(4,4) spinor) programme, integrated with the pure-Rust SUNDIALS 7.8.0 CVODE engine."
publish = false

# Own, empty workspace: this crate is built on its own from its directory
# (the repository-root .cargo/config.toml pins -C target-feature=+fma).
[workspace]

[dependencies]
sundials_core = { path = "../../vendor/rustSolveIt/sundials_rs/crates/sundials_core" }
cvode_rs = { path = "../../vendor/rustSolveIt/sundials_rs/crates/cvode_rs" }

[profile.release]
opt-level = 3
